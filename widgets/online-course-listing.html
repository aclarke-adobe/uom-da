<div class="online-course-listing-filters">
  <form class="online-course-listing-form" novalidate>
    <fieldset class="online-course-listing-fieldset">
      <legend class="online-course-listing-sr-only">Filter courses</legend>
      <div class="online-course-listing-facets"></div>
    </fieldset>
  </form>
</div>
<div class="online-course-listing-results">
  <div class="online-course-listing-bar">
    <p class="online-course-listing-info" role="status" aria-live="polite">Loading courses…</p>
    <a class="online-course-listing-browse" href="/find">Browse all courses</a>
  </div>
  <ul class="online-course-listing-tags" aria-label="Selected filters"></ul>
  <div class="online-course-listing-message" hidden></div>
  <ul class="online-course-listing-list"></ul>
  <div class="online-course-listing-more" hidden>
    <button type="button" class="online-course-listing-more-button">Load more</button>
  </div>
</div>
